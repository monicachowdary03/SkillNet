<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - SkillNet</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">
    <img src="/images/logo.jpeg" alt="SkillNet">
    <span>SkillNet</span>
  </a>
  <div class="navbar-links" id="nav-user-links"></div>
</nav>

<div style="max-width:700px;margin:32px auto;padding:0 16px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
    <h1 style="font-family:var(--font-display);font-size:24px;">🔔 Notifications</h1>
    <button class="btn btn-sm" style="background:var(--cream);" onclick="markAllRead()">Mark all read</button>
  </div>
  <div id="notif-container">
    <div class="loader"><div class="spinner"></div> Loading...</div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
const currentUser = API.getUser();
if (!currentUser) window.location.href = '/login';

const NOTIF_ICONS = { answer: '💬', vote: '▲', comment: '💭', accept: '✅', badge: '🏅' };

async function loadNotifications() {
  try {
    const notifs = await API.get('/users/me/notifications');
    const container = document.getElementById('notif-container');
    if (notifs.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="icon">🔔</div><h3>No notifications yet</h3><p>You'll be notified when someone answers or comments.</p></div>`;
      return;
    }
    container.innerHTML = `<div class="notif-list">${notifs.map(n => `
      <a href="${n.link || '/'}" class="notif-item ${n.read ? '' : 'unread'}" style="text-decoration:none;">
        <div class="notif-icon">${NOTIF_ICONS[n.type] || '🔔'}</div>
        <div class="notif-content">
          <div class="notif-message">${escHtml(n.message)}</div>
          <div class="notif-time">${timeAgo(n.createdAt)}</div>
        </div>
        ${!n.read ? '<div style="width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:4px;"></div>' : ''}
      </a>`).join('')}</div>`;
  } catch(err) {
    document.getElementById('notif-container').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

async function markAllRead() {
  try {
    await API.post('/users/me/notifications/read', {});
    loadNotifications();
    showToast('All marked as read', 'success');
  } catch(err) { showToast(err.message, 'error'); }
}

loadNotifications();
</script>
</body>
</html>
