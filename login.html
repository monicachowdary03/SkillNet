<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillNet</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    #otp-panel { display: none; }
    .otp-inputs {
      display: flex; gap: 10px; justify-content: center; margin: 20px 0 8px;
    }
    .otp-inputs input {
      width: 46px; height: 54px; text-align: center; font-size: 22px;
      font-weight: 700; border: 2px solid var(--border,#d1d5db); border-radius: 10px;
      outline: none; transition: border-color .2s, box-shadow .2s;
      font-family: monospace; background: var(--bg-card,#fff); color: var(--text-primary,#111827);
    }
    .otp-inputs input:focus  { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .otp-inputs input.filled { border-color:#6366f1; background:#f0f0ff; }
    .otp-inputs input.error  { border-color:#dc2626; background:#fff0f0; }
    .err-box {
      display:none; background:#fff0f0; color:#dc2626;
      border:1.5px solid #fca5a5; border-radius:8px;
      padding:12px 16px; font-size:14px; font-weight:500; margin-bottom:14px;
    }
    .ok-box {
      display:none; background:#f0fdf4; color:#166534;
      border:1.5px solid #86efac; border-radius:8px;
      padding:12px 16px; font-size:14px; font-weight:500; margin-bottom:14px;
    }
    .masked-email { font-weight:600; color:#6366f1; }
    .resend-row {
      text-align:center; margin-top:14px; font-size:13px; color:var(--text-muted,#6b7280);
    }
    #resend-btn {
      background:none; border:none; color:#6366f1; cursor:pointer;
      font-size:13px; padding:0; text-decoration:underline;
    }
    #resend-btn:disabled { color:var(--text-muted,#9ca3af); cursor:default; text-decoration:none; }
    .step-dots { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--border,#d1d5db); transition:.3s; }
    .dot.active { background:#6366f1; transform:scale(1.3); }
    .dot.done   { background:#10b981; }
    .dot-line   { width:32px; height:2px; background:var(--border,#e5e7eb); border-radius:2px; }
    .back-btn {
      display:inline-flex; align-items:center; gap:4px; font-size:13px;
      color:var(--text-muted,#6b7280); cursor:pointer;
      background:none; border:none; padding:0; margin-bottom:16px;
    }
    .back-btn:hover { color:#6366f1; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">
    <img src="/images/logo.jpeg" alt="SkillNet"><span>SkillNet</span>
  </a>
  <div class="navbar-links" id="nav-user-links"></div>
</nav>

<div style="max-width:460px;margin:60px auto;padding:0 16px;">
  <div class="card" style="padding:36px;">

    <div class="step-dots">
      <div class="dot active" id="dot1"></div>
      <div class="dot-line"></div>
      <div class="dot" id="dot2"></div>
    </div>

    <!-- STEP 1: Email + Password -->
    <div id="login-panel">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="font-size:40px;margin-bottom:8px;">🧩</div>
        <h1 style="font-family:var(--font-display);font-size:24px;margin-bottom:4px;">Welcome back</h1>
        <p style="color:var(--text-muted);font-size:14px;">Log in to your SkillNet account</p>
      </div>
      <div class="err-box" id="login-err"></div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="email" placeholder="your@email.com" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Your password">
      </div>
      <button class="btn btn-primary" onclick="submitLogin()"
        style="width:100%;justify-content:center;margin-top:8px;" id="login-btn">
        Continue →
      </button>
      <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--text-muted);">
        Don't have an account? <a href="/register">Sign up</a>
      </p>
    </div>

    <!-- STEP 2: OTP -->
    <div id="otp-panel">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:38px;margin-bottom:8px;">📨</div>
        <h1 style="font-family:var(--font-display);font-size:22px;margin-bottom:6px;">Check your email</h1>
        <p style="color:var(--text-muted);font-size:14px;line-height:1.6;">
          We sent a 6-digit OTP to<br>
          <span class="masked-email" id="masked-display"></span>
        </p>
      </div>
      <div class="ok-box"  id="otp-ok"></div>
      <div class="err-box" id="otp-err"></div>
      <div class="otp-inputs" id="otp-inputs">
        <input type="text" maxlength="1" inputmode="numeric" id="otp0" autocomplete="one-time-code">
        <input type="text" maxlength="1" inputmode="numeric" id="otp1">
        <input type="text" maxlength="1" inputmode="numeric" id="otp2">
        <input type="text" maxlength="1" inputmode="numeric" id="otp3">
        <input type="text" maxlength="1" inputmode="numeric" id="otp4">
        <input type="text" maxlength="1" inputmode="numeric" id="otp5">
      </div>
      <button class="btn btn-primary" onclick="submitOtp()"
        style="width:100%;justify-content:center;margin-top:8px;" id="verify-btn">
        Verify OTP
      </button>
      <div class="resend-row">
        Didn't receive it?
        <button id="resend-btn" onclick="resendOtp()" disabled>Resend OTP</button>
        <span id="countdown"></span>
      </div>
    </div>

  </div>
</div>

<script src="/js/app.js"></script>
<script>
let pendingEmail = '';
let cdTimer = null;

if (API.getUser()) window.location.href = '/';

async function submitLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  hideBox('login-err');
  if (!email || !password) { showErr('login-err','Please enter your email and password'); return; }
  btn.textContent = 'Sending OTP…'; btn.disabled = true;
  try {
    const data = await API.post('/auth/login', { email, password });
    pendingEmail = email;
    document.getElementById('masked-display').textContent = data.maskedEmail || email;
    switchToOtp();
  } catch (err) {
    showErr('login-err', err.message || 'Invalid email or password');
    shake('login-panel');
    document.getElementById('email').style.borderColor    = '#dc2626';
    document.getElementById('password').style.borderColor = '#dc2626';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
    btn.textContent = 'Continue →'; btn.disabled = false;
  }
}

function switchToOtp() {
  document.getElementById('login-panel').style.display = 'none';
  document.getElementById('otp-panel').style.display   = 'block';
  document.getElementById('dot1').className = 'dot done';
  document.getElementById('dot2').className = 'dot active';
  document.getElementById('otp0').focus();
  startCountdown(60);
}

function goBack() {
  clearInterval(cdTimer);
  document.getElementById('otp-panel').style.display   = 'none';
  document.getElementById('login-panel').style.display = 'block';
  document.getElementById('dot1').className = 'dot active';
  document.getElementById('dot2').className = 'dot';
  hideBox('login-err'); hideBox('otp-err'); hideBox('otp-ok');
  for (let i=0;i<6;i++) { document.getElementById('otp'+i).value=''; document.getElementById('otp'+i).className=''; }
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Continue →'; btn.disabled = false;
}

async function submitOtp() {
  const otp = Array.from({length:6},(_,i)=>document.getElementById('otp'+i).value).join('');
  const btn = document.getElementById('verify-btn');
  hideBox('otp-err');
  if (otp.length < 6) { showErr('otp-err','Please enter the full 6-digit OTP'); return; }
  btn.textContent = 'Verifying…'; btn.disabled = true;
  try {
    const data = await API.post('/auth/verify-otp', { email: pendingEmail, otp });
    API.setAuth(data.token, data.user);
    window.location.href = new URLSearchParams(location.search).get('redirect') || '/';
  } catch (err) {
    showErr('otp-err', err.message);
    shake('otp-inputs');
    for (let i=0;i<6;i++) document.getElementById('otp'+i).classList.add('error');
    setTimeout(()=>{ for(let i=0;i<6;i++) document.getElementById('otp'+i).classList.remove('error'); },600);
    btn.textContent = 'Verify OTP'; btn.disabled = false;
  }
}

async function resendOtp() {
  hideBox('otp-err'); hideBox('otp-ok');
  document.getElementById('resend-btn').disabled = true;
  try {
    const data = await API.post('/auth/resend-otp', { email: pendingEmail });
    showOk('otp-ok', '✅ ' + data.message);
    for (let i=0;i<6;i++) { document.getElementById('otp'+i).value=''; document.getElementById('otp'+i).className=''; }
    document.getElementById('otp0').focus();
    startCountdown(60);
  } catch (err) {
    showErr('otp-err', err.message);
    document.getElementById('resend-btn').disabled = false;
  }
}

function startCountdown(sec) {
  clearInterval(cdTimer);
  const cd=document.getElementById('countdown'), btn=document.getElementById('resend-btn');
  btn.disabled=true; let n=sec;
  function tick(){ cd.textContent=` (${n}s)`; n--; if(n<0){clearInterval(cdTimer);btn.disabled=false;cd.textContent='';} }
  tick(); cdTimer=setInterval(tick,1000);
}

for (let i=0;i<6;i++) {
  const el=document.getElementById('otp'+i);
  el.addEventListener('input', e=>{
    const v=e.target.value.replace(/\D/g,''); e.target.value=v;
    e.target.classList.toggle('filled',v!=='');
    if(v && i<5) document.getElementById('otp'+(i+1)).focus();
    if(Array.from({length:6},(_,j)=>document.getElementById('otp'+j).value).every(x=>x)) submitOtp();
  });
  el.addEventListener('keydown', e=>{
    if(e.key==='Backspace' && !e.target.value && i>0) document.getElementById('otp'+(i-1)).focus();
    if(e.key==='Enter') submitOtp();
  });
  el.addEventListener('paste', e=>{
    e.preventDefault();
    const p=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
    for(let j=0;j<6&&j<p.length;j++){const b=document.getElementById('otp'+j);b.value=p[j];b.classList.add('filled');}
    if(p.length>=6) submitOtp();
    else document.getElementById('otp'+Math.min(p.length,5)).focus();
  });
}

document.getElementById('email').addEventListener('keydown',   e=>{ if(e.key==='Enter') document.getElementById('password').focus(); });
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') submitLogin(); });
['email','password'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{
    document.getElementById(id).style.borderColor=''; hideBox('login-err');
  });
});

function showErr(id,msg){ const el=document.getElementById(id); el.textContent='⚠️ '+msg; el.style.display='block'; }
function showOk(id,msg) { const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
function hideBox(id)     { document.getElementById(id).style.display='none'; }
function shake(id){
  document.getElementById(id).animate(
    [{transform:'translateX(-8px)'},{transform:'translateX(8px)'},
     {transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],
    {duration:350}
  );
}
</script>
</body>
</html>
