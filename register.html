<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SkillNet</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .err-box {
      display:none; background:#fff0f0; color:#dc2626;
      border:1.5px solid #fca5a5; border-radius:8px;
      padding:12px 16px; font-size:14px; font-weight:500; margin-bottom:14px;
    }
    .ok-box {
      display:none; background:#f0fdf4; color:#166534;
      border:1.5px solid #86efac; border-radius:8px;
      padding:12px 16px; font-size:14px; font-weight:500; margin-bottom:14px;
    }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">
    <img src="/images/logo.jpeg" alt="SkillNet"><span>SkillNet</span>
  </a>
  <div class="navbar-links" id="nav-user-links"></div>
</nav>

<div style="max-width:520px;margin:40px auto;padding:0 16px;">
  <div class="card" style="padding:32px;">
    <h1 style="font-family:var(--font-display);font-size:26px;margin-bottom:6px;">Join SkillNet</h1>
    <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;">Create your account to start asking and answering questions</p>

    <div class="err-box" id="error-msg"></div>
    <div class="ok-box"  id="ok-msg"></div>

    <div class="form-group">
      <label class="form-label">Username *</label>
      <input class="form-input" type="text" id="username" placeholder="Choose a unique username" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Email *</label>
      <input class="form-input" type="email" id="email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password *</label>
      <input class="form-input" type="password" id="password" placeholder="At least 6 characters">
    </div>
    <div class="form-group">
      <label class="form-label">Expertise Level</label>
      <select class="form-input" id="expertise">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
        <option value="expert">Expert</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Skills <span style="color:var(--text-muted);font-size:12px;">(comma separated)</span></label>
      <input class="form-input" type="text" id="skills" placeholder="JavaScript, Python, React...">
    </div>
    <div class="form-group">
      <label class="form-label">Interests <span style="color:var(--text-muted);font-size:12px;">(comma separated)</span></label>
      <input class="form-input" type="text" id="interests" placeholder="Web Dev, AI, DevOps...">
    </div>

    <button class="btn btn-primary" onclick="register()"
      style="width:100%;justify-content:center;margin-top:8px;" id="reg-btn">
      Create Account
    </button>

    <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--text-muted);">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
// If already logged in, go home
if (API.getUser()) window.location.href = '/';

async function register() {
  const username  = document.getElementById('username').value.trim();
  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const expertise = document.getElementById('expertise').value;
  const skills    = document.getElementById('skills').value;
  const interests = document.getElementById('interests').value;
  const errEl     = document.getElementById('error-msg');
  const okEl      = document.getElementById('ok-msg');
  const btn       = document.getElementById('reg-btn');

  // Hide previous messages
  errEl.style.display = 'none';
  okEl.style.display  = 'none';

  // Validate
  if (!username) { showErr('Please enter a username'); return; }
  if (!email)    { showErr('Please enter your email'); return; }
  if (!password) { showErr('Please enter a password'); return; }
  if (password.length < 6) { showErr('Password must be at least 6 characters'); return; }

  btn.textContent = 'Creating account...';
  btn.disabled    = true;

  try {
    const data = await API.post('/auth/register', {
      username, email, password, expertise, skills, interests
    });
    API.setAuth(data.token, data.user);
    okEl.textContent    = '✅ Account created! Redirecting...';
    okEl.style.display  = 'block';
    setTimeout(() => { window.location.href = '/'; }, 1000);
  } catch (err) {
    showErr(err.message || 'Registration failed. Please try again.');
    btn.textContent = 'Create Account';
    btn.disabled    = false;
  }
}

function showErr(msg) {
  const el = document.getElementById('error-msg');
  el.textContent   = '⚠️ ' + msg;
  el.style.display = 'block';
}

// Enter key support
document.querySelectorAll('.form-input').forEach(input => {
  input.addEventListener('keydown', e => { if (e.key === 'Enter') register(); });
});
</script>
</body>
</html>
