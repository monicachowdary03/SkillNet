<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SkillNet</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">
    <img src="/images/logo.jpeg" alt="SkillNet">
    <span>SkillNet</span>
  </a>
  <div class="navbar-links" id="nav-user-links"></div>
</nav>

<div style="max-width:1150px;margin:32px auto;padding:0 16px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
    <h1 class="page-title">🛡️ Admin Dashboard</h1>
    <a href="/" class="btn" style="background:var(--cream);">← Back to Site</a>
  </div>

  <!-- Stats -->
  <div class="admin-grid" id="stats-grid">
    <div class="admin-stat-card"><div class="num" id="stat-users">–</div><div class="label">Total Users</div></div>
    <div class="admin-stat-card"><div class="num" id="stat-questions">–</div><div class="label">Questions</div></div>
    <div class="admin-stat-card"><div class="num" id="stat-answers">–</div><div class="label">Answers</div></div>
    <div class="admin-stat-card"><div class="num" id="stat-suspended">–</div><div class="label">Suspended</div></div>
    <div class="admin-stat-card"><div class="num" id="stat-categories">–</div><div class="label">Categories</div></div>
  </div>

  <!-- Tabs -->
  <div class="sort-tabs" style="margin-bottom:20px;">
    <button class="sort-tab active" onclick="showTab('users',this)">👥 Users</button>
    <button class="sort-tab" onclick="showTab('questions',this)">❓ Questions</button>
    <button class="sort-tab" onclick="showTab('categories',this)">📂 Categories</button>
  </div>

  <!-- Users Tab -->
  <div id="tab-users" class="admin-tab-panel active">
    <div class="card" style="overflow:hidden;">
      <div id="users-table-container"><div class="loader"><div class="spinner"></div> Loading users...</div></div>
    </div>
  </div>

  <!-- Questions Tab -->
  <div id="tab-questions" class="admin-tab-panel">
    <div class="card" style="overflow:hidden;">
      <div id="questions-table-container"><div class="loader"><div class="spinner"></div> Loading questions...</div></div>
    </div>
  </div>

  <!-- Categories Tab - Admin Module: Manage categories & tags -->
  <div id="tab-categories" class="admin-tab-panel">
    <div class="card" style="padding:20px;margin-bottom:16px;">
      <h3 style="margin-bottom:16px;font-size:15px;font-weight:700;">➕ Add New Category</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr 80px 140px;gap:12px;align-items:end;">
        <div class="form-group" style="margin:0;">
          <label class="form-label">Name</label>
          <input class="form-input" id="cat-name" placeholder="Category name">
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Description</label>
          <input class="form-input" id="cat-desc" placeholder="Short description">
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Icon</label>
          <input class="form-input" id="cat-icon" placeholder="📂" maxlength="4">
        </div>
        <button class="btn btn-primary" onclick="addCategory()">Add Category</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
        <div class="form-group" style="margin:0;">
          <label class="form-label">Subjects <span style="color:var(--text-muted);font-size:12px;">(comma separated)</span></label>
          <input class="form-input" id="cat-subjects" placeholder="React, Vue, Angular...">
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Color</label>
          <input class="form-input" type="color" id="cat-color" value="#2563eb">
        </div>
      </div>
    </div>
    <div class="card" style="overflow:hidden;">
      <div id="categories-table-container"><div class="loader"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<!-- Set Moderator Modal -->
<div id="mod-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;">
  <div class="card" style="width:440px;padding:24px;position:relative;">
    <button onclick="closeMod()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
    <h3 style="margin-bottom:16px;">Set Category Moderator</h3>
    <div class="form-group">
      <label class="form-label">Category</label>
      <input class="form-input" id="mod-category" readonly>
    </div>
    <div class="form-group">
      <label class="form-label">Select User</label>
      <select class="form-input" id="mod-user-select"></select>
    </div>
    <div style="display:flex;gap:12px;justify-content:flex-end;">
      <button class="btn" style="background:var(--cream);" onclick="closeMod()">Cancel</button>
      <button class="btn btn-primary" onclick="setModerator()">Assign Moderator</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
const currentUser = API.getUser();
if (!currentUser || (currentUser.role !== 'admin' && currentUser.role !== 'moderator')) {
  window.location.href = '/';
}

let allUsers = [];

function showTab(tab, btn) {
  document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.admin-tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (tab === 'questions') loadAdminQuestions();
  if (tab === 'categories') loadCategories();
}

async function loadStats() {
  try {
    const stats = await API.get('/admin/stats');
    document.getElementById('stat-users').textContent = stats.totalUsers;
    document.getElementById('stat-questions').textContent = stats.totalQuestions;
    document.getElementById('stat-answers').textContent = stats.totalAnswers;
    document.getElementById('stat-suspended').textContent = stats.suspendedUsers;
    document.getElementById('stat-categories').textContent = stats.totalCategories;
  } catch(e) {}
}

async function loadUsers() {
  const container = document.getElementById('users-table-container');
  try {
    const users = await API.get('/admin/users');
    allUsers = users;
    container.innerHTML = `
      <table class="table">
        <thead>
          <tr><th>Username</th><th>Email</th><th>Role</th><th>Expertise</th><th>Rep</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
        </thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td><a href="/profile?id=${u._id}" style="font-weight:600;">${escHtml(u.username)}</a></td>
              <td style="color:var(--text-muted);font-size:13px;">${escHtml(u.email)}</td>
              <td>
                <select onchange="changeRole('${u._id}',this.value)" class="form-input" style="padding:4px 8px;font-size:12px;width:110px;"
                  ${u._id === currentUser.id ? 'disabled' : ''}>
                  <option value="user" ${u.role==='user'?'selected':''}>User</option>
                  <option value="moderator" ${u.role==='moderator'?'selected':''}>Moderator</option>
                  <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                </select>
              </td>
              <td>${expertiseBadge(u.expertise)}</td>
              <td>${u.reputation||0}</td>
              <td><span style="color:${u.isSuspended?'var(--red)':'var(--green)'};font-weight:600;font-size:13px;">${u.isSuspended?'🔴 Suspended':'🟢 Active'}</span></td>
              <td style="font-size:12px;color:var(--text-muted);">${new Date(u.createdAt).toLocaleDateString()}</td>
              <td>
                ${u._id !== currentUser.id ? `
                  ${u.isSuspended
                    ? `<button class="btn btn-sm" style="background:var(--green);color:white;" onclick="unsuspendUser('${u._id}')">Restore</button>`
                    : `<button class="btn btn-danger btn-sm" onclick="suspendUser('${u._id}')">Suspend</button>`}` :
                  '<span style="color:var(--text-muted);font-size:12px;">–</span>'}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(err) {
    container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

async function loadAdminQuestions() {
  const container = document.getElementById('questions-table-container');
  try {
    const data = await API.get('/questions?limit=50&sort=newest');
    container.innerHTML = `
      <table class="table">
        <thead>
          <tr><th>Question</th><th>Author</th><th>Category</th><th>Votes</th><th>Answers</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody>
          ${data.questions.map(q => `
            <tr>
              <td style="max-width:260px;"><a href="/question/${q._id}" style="font-weight:600;font-size:13px;">${escHtml(q.title)}</a></td>
              <td>${escHtml(q.authorName||'–')}</td>
              <td><a href="/category/${encodeURIComponent(q.category)}" class="category-tag" style="font-size:11px;">${escHtml(q.category||'General')}</a></td>
              <td>${q.votes||0}</td>
              <td>${q.answers?.length||0}</td>
              <td style="font-size:12px;color:var(--text-muted);">${new Date(q.createdAt).toLocaleDateString()}</td>
              <td style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q._id}')">Delete</button>
                <button class="btn btn-sm" style="background:var(--cream);font-size:11px;" onclick="closeQuestion('${q._id}')">Close</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(err) {
    container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

async function loadCategories() {
  const container = document.getElementById('categories-table-container');
  try {
    const cats = await API.get('/admin/categories');
    container.innerHTML = `
      <table class="table">
        <thead>
          <tr><th>Icon</th><th>Name</th><th>Description</th><th>Subjects</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
          ${cats.map(c => `
            <tr>
              <td style="font-size:20px;">${c.icon||'📂'}</td>
              <td><strong>${escHtml(c.name)}</strong></td>
              <td style="font-size:12px;color:var(--text-muted);max-width:180px;">${escHtml(c.description||'–')}</td>
              <td style="font-size:12px;">${(c.subjects||[]).join(', ')||'–'}</td>
              <td><span style="color:${c.isActive?'var(--green)':'var(--red)'};font-size:12px;font-weight:600;">${c.isActive?'Active':'Inactive'}</span></td>
              <td style="display:flex;gap:6px;">
                <button class="btn btn-sm" style="background:var(--cream);" onclick="openModModal('${escHtml(c.name)}')">👤 Mod</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCategory('${c._id}','${escHtml(c.name)}')">Delete</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch(err) {
    container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

function openModModal(categoryName) {
  document.getElementById('mod-category').value = categoryName;
  const sel = document.getElementById('mod-user-select');
  sel.innerHTML = allUsers.map(u => `<option value="${u._id}|${u.username}">${escHtml(u.username)} (${u.role})</option>`).join('');
  document.getElementById('mod-modal').style.display = 'flex';
}

function closeMod() { document.getElementById('mod-modal').style.display = 'none'; }

async function setModerator() {
  const cat = document.getElementById('mod-category').value;
  const [userId, username] = document.getElementById('mod-user-select').value.split('|');
  try {
    await API.post(`/admin/categories/${encodeURIComponent(cat)}/moderator`, { userId, username, action: 'add' });
    showToast(`${username} set as moderator for ${cat}`, 'success');
    closeMod();
  } catch(err) { showToast(err.message, 'error'); }
}

async function addCategory() {
  const name = document.getElementById('cat-name').value.trim();
  const description = document.getElementById('cat-desc').value.trim();
  const icon = document.getElementById('cat-icon').value.trim() || '📂';
  const color = document.getElementById('cat-color').value;
  const subjects = document.getElementById('cat-subjects').value;
  if (!name) return showToast('Category name required', 'error');
  try {
    await API.post('/admin/categories', { name, description, icon, color, subjects });
    showToast('Category added!', 'success');
    ['cat-name','cat-desc','cat-icon','cat-subjects'].forEach(id => document.getElementById(id).value = '');
    loadCategories();
    loadStats();
  } catch(err) { showToast(err.message, 'error'); }
}

async function deleteCategory(id, name) {
  if (!confirm(`Delete category "${name}"? Questions in this category won't be deleted.`)) return;
  try {
    await API.delete(`/admin/categories/${id}`);
    showToast('Category deleted', 'success');
    loadCategories();
    loadStats();
  } catch(err) { showToast(err.message, 'error'); }
}

async function changeRole(id, role) {
  try {
    await API.post(`/admin/users/${id}/role`, { role });
    showToast(`Role updated to ${role}`, 'success');
  } catch(err) { showToast(err.message, 'error'); }
}

async function suspendUser(id) {
  const reason = prompt('Reason for suspension (optional):') || 'Violated community guidelines';
  try {
    await API.post(`/admin/users/${id}/suspend`, { reason });
    showToast('User suspended', 'success');
    loadUsers();
  } catch(err) { showToast(err.message, 'error'); }
}

async function unsuspendUser(id) {
  try {
    await API.post(`/admin/users/${id}/unsuspend`);
    showToast('User restored', 'success');
    loadUsers();
  } catch(err) { showToast(err.message, 'error'); }
}

async function deleteQuestion(id) {
  if (!confirm('Delete this question?')) return;
  try {
    await API.delete(`/admin/questions/${id}`);
    showToast('Question deleted', 'success');
    loadAdminQuestions();
    loadStats();
  } catch(err) { showToast(err.message, 'error'); }
}

async function closeQuestion(id) {
  const reason = prompt('Reason for closing:') || 'Closed by moderator';
  try {
    await API.post(`/admin/questions/${id}/close`, { reason });
    showToast('Question closed', 'success');
    loadAdminQuestions();
  } catch(err) { showToast(err.message, 'error'); }
}

loadStats();
loadUsers();
</script>
</body>
</html>
